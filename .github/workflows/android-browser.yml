name: Build Abu Jilan Browser APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-browser/**'
      - '.github/workflows/android-browser.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Accept licenses and install Android packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android-browser
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Abu-Jilan-Browser-debug
          path: android-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
