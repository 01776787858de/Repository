plugins { id 'com.android.application' }

android {
    namespace 'com.abujilan.browser'
    compileSdk 37
    compileSdkMinor 2

    defaultConfig {
        applicationId 'com.abujilan.browser'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1-geckoview-arm64'

        // The intended phone is ARM64; excluding x86_64 and 32-bit ARM
        // keeps the APK much smaller and avoids unused native GeckoView libraries.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // GeckoView is Mozilla's browser engine (the same engine family used by Firefox).
    implementation "org.mozilla.geckoview:geckoview:159.0.20261022150525"
}
