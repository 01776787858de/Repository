plugins { id 'com.android.application' }

android {
    namespace 'com.abujilan.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abujilan.browser'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0-geckoview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // GeckoView is Mozilla's browser engine (the same engine family used by Firefox).
    implementation "org.mozilla.geckoview:geckoview-stable:+"
}
